<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | GUoABC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>

<body class="flex min-h-screen flex-col bg-stone-100 text-slate-800">

    <header class="bg-slate-900 px-6 py-5 text-white">
        <div class="mx-auto flex max-w-4xl flex-col gap-4
                md:flex-row md:items-center md:justify-between">
            <h1 class="text-xl font-bold">
                <a href="index.html">Great University of ABC</a>
            </h1>

            <nav aria-label="Main navigation" class="flex gap-5 text-sm">
                <a href="index.html" class="transition-colors hover:text-red-300">Home</a>
                <a href="about.html" class="transition-colors hover:text-red-300">About</a>
                <a href="contact.html" class="transition-colors hover:text-red-300">Contact</a>
            </nav>
        </div>
    </header>

    <main class="mx-auto w-full max-w-xl flex-1 px-6 py-12">
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-black-700">
            About You
        </p>

        <h2 class="mb-3 text-3xl font-bold">Update Your Information</h2>
        <p class="mb-8 text-slate-600">
            Enter your name and email to update your student profile.
        </p>

        <form id="profileForm" class="space-y-6 rounded-xl bg-white p-6 shadow md:p-8">

            <div>
                <label for="name" class="mb-2 block font-semibold">Full Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="message"
                    placeholder="Enter your full name" class="w-full border border-stone-300 p-3
                focus:outline-none focus:ring-2 focus:ring-slate-300">
            </div>

            <div>
                <label for="email" class="mb-2 block font-semibold">Email Address</label>
                <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="message"
                    placeholder="Enter your email address" class="w-full border border-stone-300 p-3
                 focus:outline-none focus:ring-2 focus:ring-slate-300">
            </div>

            <p id="message" role="alert" class="text-sm text-red-700"></p>

            <button type="submit" class="w-full rounded-lg bg-black px-6 py-3
               font-semibold text-white hover:text-red-700
               hover:bg-slate-800 transition-colors duration-300">
                Save and View Profile
            </button>
        </form>
    </main>

    <footer class="border-t border-stone-300 p-5 text-center text-sm text-slate-500">
        &copy; 2026 Great University of ABC. All rights reserved.
    </footer>

</body>

</html>
